name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build-release:
    name: Build and stage signed release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Validate gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Install cargo-android
        run: cargo install --git https://github.com/chenxiaolong/cargo-android --tag v0.1.6

      - name: Install toolchains
        run: |
          rustup target add aarch64-linux-android
          rustup target add thumbv7neon-linux-androideabi
          rustup target add x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/msd-ksu-release.jks"

      - name: Build signed release
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/msd-ksu-release.jks
          RELEASE_KEYSTORE_PASSPHRASE: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
          RELEASE_KEY_ALIAS: msd-ksu
          RELEASE_KEY_PASSPHRASE: ${{ secrets.RELEASE_KEY_PASSPHRASE }}
        run: ./gradlew --no-daemon assembleRelease lintRelease zipRelease

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/msd-ksu-release.jks"

      - name: Verify module and create checksums
        run: python3 scripts/verify-release.py "$GITHUB_REF_NAME"

      - name: Upload release build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MSD-KSU-release
          path: app/build/distributions/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Stage GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: MSD-KSU ${{ github.ref_name }}
          body_path: RELEASE.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            app/build/distributions/release/*.zip
            app/build/distributions/release/SHA256SUMS
            app/build/distributions/release/release-signing-certificate.*
